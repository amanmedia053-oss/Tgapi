<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>د مینې ډېوه</title>
    
    <!-- Capacitor Early Startup Handler -->
    <script>
      // 1. Core suppression listener inside the Capture Phase.
      // Registers at the absolute top of the stack and intercepts errors before they propagate anywhere else (including parent test runner frames).
      window.addEventListener('error', function(event) {
        if (!event) return;
        var msg = (event.message || '').toString();
        var filename = (event.filename || '').toString();

        var isScriptError = !msg || msg === 'Script error.' || msg.toLowerCase().indexOf('script error') > -1;
        var isExtension = filename.indexOf('chrome-extension') > -1 || filename.indexOf('moz-extension') > -1 || filename.indexOf('extension') > -1;
        
        // Ensure local dev/build paths or sandbox domains are our app
        var isLocal = filename && (
          filename.indexOf('src/') > -1 || 
          filename.indexOf('main.tsx') > -1 || 
          filename.indexOf('localhost') > -1 || 
          filename.indexOf('run.app') > -1 || 
          filename.indexOf('index') > -1
        );

        if (isScriptError || isExtension || (filename && !isLocal)) {
          console.warn('[Dewa Suppression] Capture Intercepted & Prevented cross-origin/extension error:', msg, 'from:', filename);
          try {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          } catch(e) {}
        } else {
          // It's a genuine app error, send telemetry or display debugger if active
          console.error('[Dewa Runtime Crash]:', event.error || event);
          var rootLog = document.getElementById('early-crash-debugger');
          if (rootLog) {
            var pre = document.getElementById('early-crash-msg');
            if (pre) {
              var lineno = event.lineno !== undefined ? event.lineno : '?';
              pre.textContent += '\n[' + new Date().toISOString() + '] ' + msg + ' (' + filename + ':' + lineno + ')';
            }
          }
        }
      }, true); // TRUE denotes capture phase (critical for stopping parent iframe system listeners!)

      // Also setup unhandledrejection capture-phase blocker
      window.addEventListener('unhandledrejection', function(event) {
        if (!event) return;
        var reason = event.reason;
        var msg = reason ? (reason.message || reason).toString() : '';
        if (!msg || msg.toLowerCase().indexOf('script error') > -1) {
          console.warn('[Dewa Suppression] Suppressed unhandled cross-origin promise rejection:', msg);
          try {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          } catch(e) {}
        }
      }, true);

      // Global window.onerror compatibility fallback
      window.onerror = function(msg, url, line, col, error) {
        var strMsg = (msg || '').toString();
        var strUrl = (url || '').toString();
        if (strMsg.toLowerCase().indexOf('script error') > -1 || !strUrl || (strUrl.indexOf('localhost') === -1 && strUrl.indexOf('run.app') === -1 && strUrl.indexOf('src/') === -1)) {
          console.warn('[Dewa Suppression] Native fallback blocked error:', strMsg);
          return true; // Return true tells standard web engines to completely cancel/ignore the error
        }
        return false;
      };

      // Detect Capacitor bridge and log early load status
      document.addEventListener('DOMContentLoaded', function() {
        console.log('[Dewa Capacitor Bootstrap] DOM Content Ready');
        if (window.Capacitor && typeof window.Capacitor.getPlatform === 'function') {
          console.log('[Dewa Capacitor Bootstrap] Native Bridge is fully active. Platform: ' + window.Capacitor.getPlatform());
        } else {
          console.log('[Dewa Capacitor Bootstrap] Running in standard Web Browser environment.');
        }
      });
    </script>
    
    <style>
      #early-crash-debugger {
        direction: rtl;
        font-family: system-ui, -apple-system, sans-serif;
        display: none;
        position: fixed;
        inset: 0;
        background: #0f172a;
        color: #f1f5f9;
        z-index: 999999;
        padding: 24px;
        text-align: right;
        overflow-y: auto;
      }
      .crash-card {
        background: #1e293b;
        border: 1px solid #ef4444;
        border-radius: 12px;
        padding: 16px;
        margin-top: 20px;
      }
      .crash-code {
        background: #020617;
        padding: 12px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 11px;
        color: #f87171;
        direction: ltr;
        text-align: left;
        white-space: pre-wrap;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
      }
    </style>
  </head>
  <body class="bg-slate-950">
    <!-- Clean, simple DOM root for React mount -->
    <div id="root"></div>

    <!-- Hidden native-level diagnostic fallback canvas -->
    <div id="early-crash-debugger">
      <h2 style="font-size: 18px; font-weight: bold; color: #ef4444; margin-bottom: 8px;">د اپلیکیشن تر پايه ناکامي</h2>
      <p style="font-size: 13px; color: #94a3b8; line-height: 1.6;">بښنه غواړو، مګر د پیلیدو پروګرام په موبایل کې د غېر کتنې تر ستونزو لاندې خراب شو. لاندې بڼه کتلای شئ:</p>
      
      <div class="crash-card">
        <h3 style="font-size: 13px; font-weight: bold; margin-bottom: 6px;">د خطا کوډ او معلومات (Diagnostics):</h3>
        <pre id="early-crash-msg" class="crash-code">Initialization Failure Diagnostics:</pre>
      </div>
      
      <p style="font-size: 11px; color: #64748b; margin-top: 15px; text-align: center;">د مینې ډېوه ملاتړ ګروپ</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
